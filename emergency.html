<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeroAsha – Emergency Ambulance</title>
  <link rel="stylesheet" href="emergency.css">
</head>

<body>

  <h1>🚑 Emergency Ambulance</h1>

  <!-- STEP 1 -->
  <div id="step1" class="step card">
    <p>Allow location to find the nearest hospital.</p>
    <button class="btn" id="allowBtn">Allow Location</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step card"></div>

  <!-- STEP 3 -->
  <div id="step3" class="step card">
    <h3>Ambulance on the way 🚨</h3>
    <div id="map">Navigation opened in Google Maps</div>
    <button class="btn secondary" id="doneBtn">Done</button>
  </div>

  <script src="emergency.js"></script>
</body>
</html>
